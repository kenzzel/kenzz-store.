<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2e8"><title>Admin Dashboard — Kenzz Store</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="topbar"><div class="container nav"><a class="logo" href="index.html">✦ KENZZ<span>STORE</span></a><nav><a href="index.html">Toko</a><a href="admin.html">Admin</a><a href="owner.html">Owner</a></nav><div class="navright"><span id="whoami" class="muted"></span><button class="btn outline" id="logout">Keluar</button></div></div></header><main class="container" style="padding:32px 0 70px">
<div class="pageHead"><div><div class="eyebrow">STORE MANAGEMENT</div><h1>Admin Dashboard</h1><p>Halaman terpisah untuk mengelola produk, pesanan, dan deposit.</p></div><button class="btn outline" id="refresh">↻ Refresh</button></div>
<div id="notice" class="panel">Memeriksa sesi login...</div>
<div id="adminApp" class="hidden">
<div class="stats"><div class="stat"><small>Produk aktif</small><b id="countProducts">0</b></div><div class="stat"><small>Pesanan</small><b id="countOrders">0</b></div><div class="stat"><small>Deposit pending</small><b id="countDeposits">0</b></div></div>
<div class="adminGrid">
<div class="panel"><h3 id="formTitle">Tambah produk</h3><form id="productForm" class="form"><input type="hidden" id="productId"><label class="label">Nama produk</label><input class="input" id="name" required><label class="label">Harga (Rp)</label><input class="input" id="price" type="number" min="1" required><label class="label">Kategori</label><select class="input" id="category"><option value="app">Aplikasi</option><option value="digital">Digital</option><option value="other">Lainnya</option></select><label class="label">Deskripsi</label><textarea class="input" id="description" rows="3"></textarea><label class="label">URL gambar</label><input class="input" id="image"><label class="label">Stok (-1 = tak terbatas)</label><input class="input" id="stock" type="number" value="-1"><label class="check"><input id="active" type="checkbox" checked> Produk aktif</label><div class="actions"><button class="btn main">Simpan produk</button><button class="btn outline" type="button" id="reset">Reset</button></div></form></div>
<div class="panel"><h3>Daftar produk</h3><div id="products"></div></div></div>
<div class="panel compact"><h3>Pesanan terbaru</h3><div id="orders"></div></div><div class="panel compact"><h3>Deposit terbaru</h3><div id="deposits"></div></div></div>
</main><div class="toast" id="toast"></div><script src="admin.js"></script></body></html>
